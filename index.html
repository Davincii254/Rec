<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="receipt">
        <div class="receipt-header">
            <img src="public/circle.png"  class="qr-code">
            <p><span>Success</span></p>
            <h1><span>MUR 9,999.00</span></h1>
            <p>Transaction reference:</p>
            <p>FT2528215HJS</p>
        </div>

        <div class="button-container">
            <button class="btn btn-red">View proof of transaction</button>
            <button class="btn btn-white">Done</button>
        </div>
    </div>
</body>
</html>
